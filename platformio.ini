; PlatformIO project for LilyGo T4-S3 (AMOLED 2.41")
; Firmware: BLE MIDI peripheral + LVGL touch UI + WS2812B LED strip
;
; Build: pio run -t upload && pio device monitor

[env:lilygo-t4-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi

monitor_speed = 115200
upload_speed = 115200

; Writes <build dir>/generated/fw_build.h (FW_BUILD = the git hash) before every
; build; FW_VERSION itself is in include/config.h (docs/BLE_OTA.md section 2).
extra_scripts = pre:tools/fw_build_id.py

; Do NOT add -DLV_CONF_INCLUDE_SIMPLE here (a misspelt, inert copy of it used to
; sit in this list). LVGL 8.4 finds ./lv_conf.h by itself through -I . — but with
; the macro on the command line, the chain+ dependency finder follows
; lv_conf_internal.h's `#include "lv_conf.h"` into LilyGo-AMOLED-Series/src,
; puts that library ahead of -I . on LVGL's own include path, and LVGL then
; compiles against the LilyGo copy: 16 ms instead of 42 ms refresh, a 16 px
; default font, a PSRAM heap instead of the 96 KB pool (RAM 143 KB -> 45 KB).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -I .

lib_deps =
    lewisxhe/SensorLib@^0.2.4
    lewisxhe/XPowersLib@^0.2.6
    lvgl/lvgl@^8.3.11
    fastled/FastLED@^3.6.0
    lathoub/BLE-MIDI@^2.2
    fortyseveneffects/MIDI Library@^5.0.2
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git

lib_ldf_mode = chain+
