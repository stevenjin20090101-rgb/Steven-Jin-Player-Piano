<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" xml:space="preserve" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="1600" height="1000" fill="#0B1020"/>
<text x="800" y="86" text-anchor="middle" font-size="46" font-weight="700" fill="#E8ECF8">Three lines that matter</text>
<text x="800" y="128" text-anchor="middle" font-size="21" fill="#8C96B8">Real code from the piano's brain — the comments say what each one does</text>

<g>
<rect x="60" y="190" width="1480" height="220" rx="22" fill="#151C33" stroke="#3DDC97" stroke-width="2"/>
<text x="90" y="262" font-size="30" font-weight="700" fill="#3DDC97">Safety</text>
<text x="90" y="298" font-size="16" fill="#8C96B8">a guess is treated</text>
<text x="90" y="322" font-size="16" fill="#8C96B8">as still switched on</text>
<rect x="400" y="210" width="1120" height="180" rx="12" fill="#0B1020"/>
<g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19" fill="#E8ECF8">
<text x="424" y="246">bool ok = b.chip.setPWM(kKeyToChannel[semitone], 0);</text>
<text x="424" y="274">if (ok) {</text>
<text x="464" y="302">s_onAt[board_idx][semitone]   = 0;     <tspan fill="#3DDC97">// verified: truly off</tspan></text>
<text x="424" y="330">} else {</text>
<text x="464" y="358">s_needOff[board_idx][semitone] = true; <tspan fill="#3DDC97">// unverified: treat as STILL ON</tspan></text>
<text x="424" y="386">}                                      <tspan fill="#8C96B8">// ...and retry until it lands</tspan></text>
</g>
</g>

<g>
<rect x="60" y="450" width="1480" height="220" rx="22" fill="#151C33" stroke="#FF6B57" stroke-width="2"/>
<text x="90" y="522" font-size="30" font-weight="700" fill="#FF6B57">Physics</text>
<text x="90" y="558" font-size="16" fill="#8C96B8">short notes need</text>
<text x="90" y="582" font-size="16" fill="#8C96B8">more force</text>
<rect x="400" y="470" width="1120" height="180" rx="12" fill="#0B1020"/>
<g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19" fill="#E8ECF8">
<text x="424" y="506" fill="#8C96B8">// Hammer travel goes as <tspan fill="#FF6B57" font-weight="700">F·t²</tspan>: halve the time, you need 4× the force.</text>
<text x="424" y="534" fill="#8C96B8">// A soft strike in a fast passage never reaches the string.</text>
<text x="424" y="562">uint32_t gap       = millis() - s_lastFireMs;</text>
<text x="424" y="590">uint32_t tightness = g_burstGapMs - gap;</text>
<text x="424" y="618">uint32_t pct       = (g_burstBoostPct * tightness) / g_burstGapMs;</text>
<text x="424" y="646">pwm += ((hi - pwm) * pct) / 100;     <tspan fill="#FF6B57">// the faster the notes, the harder we hit</tspan></text>
</g>
</g>

<g>
<rect x="60" y="710" width="1480" height="220" rx="22" fill="#151C33" stroke="#F472B6" stroke-width="2"/>
<text x="90" y="782" font-size="30" font-weight="700" fill="#F472B6">Humanity</text>
<text x="90" y="818" font-size="16" fill="#8C96B8">no two notes</text>
<text x="90" y="842" font-size="16" fill="#8C96B8">are ever identical</text>
<rect x="400" y="730" width="1120" height="180" rx="12" fill="#0B1020"/>
<g font-family="SF Mono, Menlo, Consolas, monospace" font-size="19" fill="#E8ECF8">
<text x="424" y="766" fill="#8C96B8">// A real player never strikes the same note twice with identical force.</text>
<text x="424" y="794">vBoosted += <tspan fill="#F472B6" font-weight="700">random</tspan>(-g_humanizeVel, g_humanizeVel + 1);</text>
<text x="424" y="822" fill="#8C96B8">// Loudness isn't linear in force. The musical detail lives at the soft end.</text>
<text x="424" y="850">t   = <tspan fill="#F472B6" font-weight="700">powf</tspan>(t, g_velCurve);              <tspan fill="#F472B6">// keeps quiet notes quiet</tspan></text>
<text x="424" y="878">pwm = lo + (hi - lo) * t;</text>
</g>
</g>

<text x="800" y="975" text-anchor="middle" font-size="16" fill="#8C96B8">Made by Steven Jin</text>
</svg>
