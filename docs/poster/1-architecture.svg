<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8C96B8"/></marker>
  <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F472B6"/></marker>
</defs>
<rect width="1600" height="900" fill="#0B1020"/>
<text x="800" y="86" text-anchor="middle" font-size="50" font-weight="700" fill="#E8ECF8">How the piano plays itself</text>
<text x="800" y="128" text-anchor="middle" font-size="22" fill="#8C96B8">A real acoustic upright, 84 solenoids pressing the actual keys — driven by one small chip</text>

<g>
<rect x="60" y="260" width="260" height="260" rx="22" fill="#151C33" stroke="#2A3457" stroke-width="2"/>
<text x="190" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#4F8CFF">Music comes in</text>
<rect x="88" y="330" width="204" height="44" rx="10" fill="#0B1020" stroke="#2A3457"/><text x="190" y="359" text-anchor="middle" font-size="17" fill="#E8ECF8">iPad · Bluetooth MIDI</text>
<rect x="88" y="386" width="204" height="44" rx="10" fill="#0B1020" stroke="#2A3457"/><text x="190" y="415" text-anchor="middle" font-size="17" fill="#E8ECF8">Touchscreen keyboard</text>
<rect x="88" y="442" width="204" height="44" rx="10" fill="#0B1020" stroke="#2A3457"/><text x="190" y="471" text-anchor="middle" font-size="17" fill="#E8ECF8">Web control panel</text>
</g>

<line x1="322" y1="390" x2="396" y2="390" stroke="#8C96B8" stroke-width="3" marker-end="url(#ah)"/>
<text x="359" y="372" text-anchor="middle" font-size="14" fill="#8C96B8">MIDI notes</text>

<g>
<rect x="400" y="260" width="280" height="260" rx="22" fill="#151C33" stroke="#A78BFA" stroke-width="3"/>
<text x="540" y="312" text-anchor="middle" font-size="30" font-weight="700" fill="#A78BFA">The brain</text>
<text x="540" y="346" text-anchor="middle" font-size="20" fill="#E8ECF8">ESP32-S3</text>
<text x="540" y="392" text-anchor="middle" font-size="16" fill="#8C96B8">decides how hard</text>
<text x="540" y="414" text-anchor="middle" font-size="16" fill="#8C96B8">and how long to strike</text>
<rect x="450" y="440" width="180" height="40" rx="20" fill="#0B1020" stroke="#A78BFA"/>
<text x="540" y="466" text-anchor="middle" font-size="16" font-weight="700" fill="#A78BFA">under 10 ms</text>
</g>

<line x1="682" y1="390" x2="756" y2="390" stroke="#8C96B8" stroke-width="3" marker-end="url(#ah)"/>
<text x="719" y="360" text-anchor="middle" font-size="14" fill="#8C96B8">I²C</text><text x="719" y="378" text-anchor="middle" font-size="12" fill="#8C96B8">isolated</text>

<g>
<rect x="760" y="260" width="260" height="260" rx="22" fill="#151C33" stroke="#2A3457" stroke-width="2"/>
<text x="890" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#F5B942">7 power boards</text>
<text x="890" y="332" text-anchor="middle" font-size="15" fill="#8C96B8">one octave each</text>
<rect x="800" y="350" width="180" height="16" rx="4" fill="#F5B942" opacity="0.9"/>
<rect x="800" y="372" width="180" height="16" rx="4" fill="#F5B942" opacity="0.8"/>
<rect x="800" y="394" width="180" height="16" rx="4" fill="#F5B942" opacity="0.7"/>
<rect x="800" y="416" width="180" height="16" rx="4" fill="#F5B942" opacity="0.6"/>
<rect x="800" y="438" width="180" height="16" rx="4" fill="#F5B942" opacity="0.5"/>
<rect x="800" y="460" width="180" height="16" rx="4" fill="#F5B942" opacity="0.4"/>
<rect x="800" y="482" width="180" height="16" rx="4" fill="#F5B942" opacity="0.3"/>
</g>

<line x1="1022" y1="390" x2="1096" y2="390" stroke="#8C96B8" stroke-width="3" marker-end="url(#ah)"/>
<text x="1059" y="372" text-anchor="middle" font-size="14" fill="#8C96B8">24 volts</text>

<g>
<rect x="1100" y="260" width="200" height="260" rx="22" fill="#151C33" stroke="#2A3457" stroke-width="2"/>
<text x="1200" y="305" text-anchor="middle" font-size="26" font-weight="700" fill="#FF6B57">84 solenoids</text>
<text x="1200" y="332" text-anchor="middle" font-size="15" fill="#8C96B8">electromagnets</text>
<rect x="1135" y="360" width="26" height="70" rx="5" fill="#FF6B57"/><rect x="1143" y="430" width="10" height="40" fill="#E8ECF8"/>
<rect x="1187" y="360" width="26" height="70" rx="5" fill="#FF6B57"/><rect x="1195" y="430" width="10" height="40" fill="#E8ECF8"/>
<rect x="1239" y="360" width="26" height="70" rx="5" fill="#FF6B57"/><rect x="1247" y="430" width="10" height="40" fill="#E8ECF8"/>
</g>

<line x1="1302" y1="390" x2="1376" y2="390" stroke="#8C96B8" stroke-width="3" marker-end="url(#ah)"/>
<text x="1339" y="372" text-anchor="middle" font-size="14" fill="#8C96B8">press</text>

<g>
<rect x="1380" y="260" width="160" height="260" rx="22" fill="#151C33" stroke="#2A3457" stroke-width="2"/>
<text x="1460" y="305" text-anchor="middle" font-size="24" font-weight="700" fill="#E8ECF8">Real keys</text>
<text x="1460" y="332" text-anchor="middle" font-size="15" fill="#8C96B8">C1 to B7</text>
<rect x="1400" y="355" width="17" height="120" fill="#F4F4F8"/><rect x="1420" y="355" width="17" height="120" fill="#F4F4F8"/><rect x="1440" y="355" width="17" height="120" fill="#F4F4F8"/><rect x="1460" y="355" width="17" height="120" fill="#F4F4F8"/><rect x="1480" y="355" width="17" height="120" fill="#F4F4F8"/><rect x="1500" y="355" width="17" height="120" fill="#F4F4F8"/>
<rect x="1412" y="355" width="12" height="72" fill="#1a1a1a"/><rect x="1432" y="355" width="12" height="72" fill="#1a1a1a"/><rect x="1472" y="355" width="12" height="72" fill="#1a1a1a"/><rect x="1492" y="355" width="12" height="72" fill="#1a1a1a"/>
</g>

<line x1="540" y1="522" x2="540" y2="650" stroke="#F472B6" stroke-width="3" marker-end="url(#ahp)"/>
<text x="560" y="600" font-size="15" fill="#F472B6">lights the key that's playing</text>
<rect x="400" y="656" width="1140" height="40" rx="20" fill="#151C33" stroke="#F472B6" stroke-width="2"/>
<g fill="#F472B6">
<circle cx="440" cy="676" r="7"/><circle cx="500" cy="676" r="7"/><circle cx="560" cy="676" r="7"/><circle cx="620" cy="676" r="7"/><circle cx="680" cy="676" r="7"/><circle cx="740" cy="676" r="7"/><circle cx="800" cy="676" r="7"/><circle cx="860" cy="676" r="7"/><circle cx="920" cy="676" r="7"/><circle cx="980" cy="676" r="7"/><circle cx="1040" cy="676" r="7"/><circle cx="1100" cy="676" r="7"/><circle cx="1160" cy="676" r="7"/><circle cx="1220" cy="676" r="7"/><circle cx="1280" cy="676" r="7"/><circle cx="1340" cy="676" r="7"/><circle cx="1400" cy="676" r="7"/><circle cx="1460" cy="676" r="7"/><circle cx="1520" cy="676" r="7"/>
</g>
<text x="970" y="726" text-anchor="middle" font-size="16" fill="#8C96B8">73-LED strip · 8 colour palettes · glows and fades with every note</text>

<text x="800" y="800" text-anchor="middle" font-size="22" fill="#E8ECF8">Music in  →  decisions in the brain  →  24 V to the solenoids  →  real hammers, real strings</text>
<text x="800" y="856" text-anchor="middle" font-size="16" fill="#8C96B8">Made by Steven Jin</text>
</svg>
