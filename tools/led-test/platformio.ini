; Minimal WS2812B LED test for the LilyGo T4-S3.
; No BLE, no I2C, no LVGL — just FastLED forcing the strip full-on so we
; can prove the LED hardware + wiring + pin independent of everything else.
;
; Build & upload:
;   cd piano_ledtest
;   ~/.platformio/penv/bin/pio run -t upload && ~/.platformio/penv/bin/pio device monitor

[env:lilygo-t4-s3-ledtest]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    fastled/FastLED@^3.6.0
