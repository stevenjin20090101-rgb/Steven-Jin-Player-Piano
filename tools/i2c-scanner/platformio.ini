; Standalone I²C scanner for the LilyGo T4-S3. Flash this BEFORE the main
; firmware to verify that each PCA9635 power board's dipswitch is set to
; the right address (0x40..0x47).
;
; Expected scan output once everything is wired and powered:
;   0x40..0x47  → eight PCA9635 power boards
;   0x5A        → touch controller (CST226SE)
;   0x6B        → PMU (SY6970)
;
; Build & upload:
;   cd piano_scanner
;   pio run -t upload && pio device monitor

[env:lilygo-t4-s3-scanner]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.psram_type = opi

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    lewisxhe/SensorLib@^0.2.4
    lewisxhe/XPowersLib@^0.2.6
    https://github.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series.git

lib_ldf_mode = chain+
